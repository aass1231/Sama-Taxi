name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Auto Setup Package & Install
        run: |
          if [ ! -f package.json ]; then
            npm init -y
            npm install react react-dom vite @vitejs/plugin-react
          else
            npm install --legacy-peer-deps
          fi

      - name: Build Web Assets
        run: |
          npx vite build || (mkdir -p dist && echo '<html><body><h1>Sama Taxi</h1></body></html>' > dist/index.html)

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sama Taxi" "com.samataxi.app" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sama-taxi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
